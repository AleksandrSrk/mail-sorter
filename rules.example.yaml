# Пример стартовых правил. При первом запуске они переносятся в базу data/mail.db,
# дальше правила и списки живут в базе (и управляются ботом). rules.yaml — в .gitignore.
#
# Блок `_all` — общие правила для ВСЕХ ящиков из MAILBOXES, проверяются раньше правил ящика.
# Ящик -> список правил. Правила проверяются по порядку, срабатывает первое подходящее.
# Условия (любое из):
#   from:             точные адреса отправителей
#   from_domain:      домены отправителей
#   subject_contains: подстроки в теме (без учёта регистра)
#   spam_header:      серверная метка спама (X-Spam-Flag / X-Spam-Status: yes)
#   learn:            сюда пишет обучение (отправители писем, брошенных в папку спама)
# Действия:
#   move_to:   папка назначения (создастся, если её нет)
#   mark_read: пометить прочитанным (по умолчанию false)
# Корзина, спам и черновики не обрабатываются никогда.

_all:
  rules:
    - name: Спам
      from: [promo@spam.example, news@mailer.example]
      from_domain: [junk.example]
      spam_header: true
      learn: true
      move_to: Нежелательная почта
      mark_read: true
  # Белый список: эти адреса и домены не считаются спамом даже по серверной метке.
  # Свои домены (из MAILBOXES) спамом не считаются никогда.
  learn_spam:
    never: [friend@gmail.example, "@partner.example"]

sales@example.ru:
  rules:
    - name: Партнёр
      from: [manager@partner.example, logistics@partner.example]
      move_to: ПАРТНЁР
    - name: Банк
      from_domain: [bank.example]
      move_to: БАНК
      mark_read: true
    - name: Отчёты
      subject_contains: [отчёт, дислокация]
      move_to: ОТЧЁТЫ
